name: Windows 배포판

# - main 에 머지/push → package.json 버전의 태그(v0.0.x)가 아직 없으면 태그 생성 + Release 게시
# - v* 태그 push      → 해당 버전 Release 게시 (npm run release:patch && git push --follow-tags)
# - PR / 수동 실행    → 같은 빌드를 수행하고 Actions 아티팩트로만 보관 (배포 전 검증)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 버전 확인 (태그 = package.json)
        id: ver
        run: |
          $v = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Error "태그 $env:GITHUB_REF_NAME 와 package.json 버전 v$v 가 다릅니다"; exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.StartsWith('0.').ToString().ToLower())" >> $env:GITHUB_OUTPUT

          # 게시 여부: 태그 push 는 항상, main push 는 해당 버전 태그가 아직 없을 때만
          # (--follow-tags 로 main 과 태그가 함께 올라오면 태그 쪽 실행이 게시 → 중복 방지)
          $publish = 'false'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $publish = 'true' }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -eq 'main') {
            $existing = git ls-remote --tags origin "refs/tags/v$v"
            if (-not $existing) { $publish = 'true' } else { Write-Host "v$v 태그가 이미 있어 게시 생략" }
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v publish=$publish"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: 패키지 조립
        run: node scripts/package.mjs

      - name: 스모크 테스트 (설치판 첫 실행 흐름)
        run: |
          $env:CAMCUE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'camcue-data'
          $env:CAMCUE_OPEN_BROWSER = '0'
          $env:PORT = '3456'
          $p = Start-Process -FilePath 'release\CamCue\node\node.exe' `
            -ArgumentList 'release\CamCue\app\dist\server\index.mjs' `
            -RedirectStandardOutput smoke.out.log -RedirectStandardError smoke.err.log -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 40 -and -not $health; $i++) {
              Start-Sleep -Seconds 1
              try { $health = Invoke-RestMethod http://localhost:3456/api/health } catch {}
            }
            if (-not $health) { throw '서버가 시작되지 않았습니다' }
            if ($health.version -ne '${{ steps.ver.outputs.version }}') { throw "버전 불일치: $($health.version)" }
            $services = @(Invoke-RestMethod http://localhost:3456/api/services)
            if ($services.Count -ne 1) { throw "샘플 예배 시드 실패 ($($services.Count))" }
            $page = Invoke-WebRequest http://localhost:3456/cam/1 -UseBasicParsing
            if ($page.Content -notmatch 'CamCue') { throw '웹 UI 서빙 실패' }
            $go = Invoke-RestMethod -Method Post http://localhost:3456/api/show/command -ContentType 'application/json' -Body '{"command":"GO"}'
            if ($go.state.cueIndex -ne 0) { throw 'GO 실패' }
            if (-not (Test-Path (Join-Path $env:CAMCUE_DATA_DIR 'config.env'))) { throw 'config.env 미생성' }
            Write-Host "스모크 테스트 통과: v$($health.version)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content smoke.out.log, smoke.err.log -ErrorAction SilentlyContinue
          }

      - name: 스모크 테스트 (포트 EACCES → 자동 포트 변경)
        # v0.0.1 에서 실제로 발생한 문제(listen EACCES) 재현.
        # Hyper-V 예약 대역은 러너에서 그대로 만들 수 없어(netsh 관리자 제외는 직접 bind 를 막지 않음),
        # 같은 EACCES(WSAEACCES)를 내는 '배타적 점유(ExclusiveAddressUse)' 소켓으로 38080 을 잡아 둔다.
        run: |
          $hold = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, 38080)
          $hold.ExclusiveAddressUse = $true
          $hold.Start()
          $env:CAMCUE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'camcue-data-eacces'
          $env:CAMCUE_OPEN_BROWSER = '0'
          Remove-Item Env:PORT -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'release\CamCue\node\node.exe' `
            -ArgumentList 'release\CamCue\app\dist\server\index.mjs' `
            -RedirectStandardOutput eacces.out.log -RedirectStandardError eacces.err.log -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 30 -and -not $health; $i++) {
              Start-Sleep -Seconds 1
              try { $health = Invoke-RestMethod http://localhost:38090/api/health -TimeoutSec 2 } catch {}
            }
            if (-not $health) { throw '38080 을 쓸 수 없는 상황에서 38090 으로 전환되지 않았습니다' }
            $out = (Get-Content eacces.out.log -Raw) + (Get-Content eacces.err.log -Raw)
            if ($out -notmatch '38080\(Windows 가 막음\)') { throw "EACCES 로 인식되지 않았습니다`n$out" }
            $cfg = Get-Content (Join-Path $env:CAMCUE_DATA_DIR 'config.env') -Raw
            if ($cfg -notmatch '(?m)^PORT=38090') { throw "config.env 에 바뀐 포트가 저장되지 않았습니다`n$cfg" }
            Write-Host 'EACCES 스모크 테스트 통과: 38080(EACCES) → 38090, config.env 저장'
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $hold.Stop()
            Get-Content eacces.out.log, eacces.err.log -ErrorAction SilentlyContinue
          }

      - name: 포터블 ZIP
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Push-Location release
          7z a -tzip -mx=7 "CamCue-portable-v$v-win-x64.zip" CamCue | Out-Null
          Pop-Location
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 설치 파일 (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" installer\CamCue.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: 릴리스 노트
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $notes = npx tsx scripts/changelog.ts notes $v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @"
          ## 다운로드

          | 파일 | 용도 |
          |---|---|
          | ``CamCue-Setup-v$v-win-x64.exe`` | **설치판 (권장)** — 시작 메뉴·바탕화면 바로가기, 방화벽 자동 허용 |
          | ``CamCue-portable-v$v-win-x64.zip`` | 포터블 — 압축 풀고 ``CamCue.cmd`` 실행 (관리자 권한 불필요) |

          - Windows 10/11 64bit. Node.js 설치 불필요 (내장)
          - 처음 실행 시 "Windows의 PC 보호" 창 → **추가 정보 → 실행** (코드 서명 미적용)
          - 큐시트·설정은 ``%LOCALAPPDATA%\CamCue`` 에 보관되어 업데이트해도 유지됩니다

          ## 변경 사항

          "@ + ($notes -join "`n") | Out-File -Encoding utf8 release\NOTES.md
          Get-Content release\NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: CamCue-v${{ steps.ver.outputs.version }}-windows
          path: |
            release/*.zip
            release/*.exe
          retention-days: 14

      - name: GitHub Release 게시
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # main push 에서는 이 커밋에 태그를 새로 만든다
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CamCue v${{ steps.ver.outputs.version }}
          body_path: release/NOTES.md
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          files: |
            release/*.zip
            release/*.exe
